name: Verify Whool Vint
on:
  push:
    paths: ['apps/vint/**', 'operations/vint/**', '.github/workflows/vint-check.yml']
  pull_request:
    paths: ['apps/vint/**', 'operations/vint/**', '.github/workflows/vint-check.yml']
permissions:
  contents: read
jobs:
  vint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm test --prefix apps/vint
      - run: npm run build --prefix apps/vint
